server {
    listen 80;
    server_name repos.musicsian.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name repos.musicsian.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/repos.musicsian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repos.musicsian.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Document root - points to current release via symlink
    root /var/www/repos.musicsian.com/current;
    index index.html;

    # Root serves the main index page
    location = / {
        try_files /index.html =404;
    }

    # Sultree repository - serves the same files but with /sultree prefix for compatibility
    location /sultree {
        # Remove /sultree from the URI and serve from root
        rewrite ^/sultree/(.*) /$1 break;
        try_files $uri $uri/ =404;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        
        # Allow .repo files to be downloaded with proper content type
        location ~* \\.repo$ {
            add_header Content-Type text/plain;
        }
        
        # Proper MIME types for RPM files
        location ~* \\.rpm$ {
            add_header Content-Type application/x-rpm;
        }
    }

    # Direct access to RPMS directory
    location /RPMS {
        try_files $uri $uri/ =404;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        
        location ~* \\.rpm$ {
            add_header Content-Type application/x-rpm;
        }
    }

    # Direct access to repodata
    location /repodata {
        try_files $uri $uri/ =404;
        autoindex on;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Direct access to .repo files
    location ~* \\.repo$ {
        try_files $uri =404;
        add_header Content-Type text/plain;
    }

    # Security: Deny access to hidden files and sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ \.(conf|md)$ {
        deny all;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
}